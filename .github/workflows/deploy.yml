name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: target/okaynow-backend-0.1.0.jar
          target: /tmp/
          strip_components: 1

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            sudo install -o ubuntu -g ubuntu -m 644 /tmp/okaynow-backend-0.1.0.jar /opt/okaynow/backend/app.jar
            rm -f /tmp/okaynow-backend-0.1.0.jar
            sudo systemctl restart okaynow-backend
            # Small EC2 needs ~20–40s for Spring Boot; wait up to ~3 minutes.
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/legal/current || true)
              if [ "$code" = "200" ]; then
                echo "Backend ready (HTTP $code after ${i} checks)"
                systemctl is-active okaynow-backend
                exit 0
              fi
              # Fail fast if the unit crashed and is no longer starting
              state=$(systemctl is-active okaynow-backend || true)
              if [ "$state" = "failed" ]; then
                echo "Backend unit failed"
                break
              fi
              sleep 3
            done
            echo "Backend failed to become ready"
            sudo systemctl status okaynow-backend --no-pager || true
            sudo journalctl -u okaynow-backend -n 80 --no-pager || true
            exit 1
