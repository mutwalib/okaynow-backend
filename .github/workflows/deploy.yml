name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: target/okaynow-backend-0.1.0.jar
          target: /tmp/

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            sudo install -o ubuntu -g ubuntu -m 644 /tmp/okaynow-backend-0.1.0.jar /opt/okaynow/backend/app.jar
            rm -f /tmp/okaynow-backend-0.1.0.jar
            sudo systemctl restart okaynow-backend
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/auth/login || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "Backend listening (HTTP $code)"
                exit 0
              fi
              sleep 2
            done
            echo "Backend failed to become ready"
            sudo systemctl status okaynow-backend --no-pager || true
            sudo journalctl -u okaynow-backend -n 60 --no-pager || true
            exit 1
