spring:
  application:
    name: okaynow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:okaynow}
    username: ${DB_USER:okaynow}
    password: ${DB_PASSWORD:okaynow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: 8080

app:
  jwt:
    # Override in production via APP_JWT_SECRET. Must be at least 32 bytes for HS256.
    secret: ${APP_JWT_SECRET:change-me-in-production-okaynow-dev-secret-key-0123456789}
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 1209600
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  bootstrap-admin:
    # Local defaults; override via env in production and remove after first boot.
    email: ${ADMIN_BOOTSTRAP_EMAIL:mutwalibb@gmail.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}
  mail:
    from: ${APP_MAIL_FROM:OkayNow <mutwalibb@gmail.com>}
    # When false (default), OTPs are logged by the server. Set true + spring.mail.* for SMTP.
    smtp-enabled: ${APP_MAIL_SMTP_ENABLED:false}
  auth:
    otp-ttl-seconds: ${APP_AUTH_OTP_TTL_SECONDS:600}
    otp-length: ${APP_AUTH_OTP_LENGTH:6}
    max-attempts: ${APP_AUTH_OTP_MAX_ATTEMPTS:5}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    max-bytes: ${APP_UPLOAD_MAX_BYTES:5242880}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/agency/billing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/agency/billing?checkout=cancel}
    price-starter: ${STRIPE_PRICE_STARTER:}
    price-professional: ${STRIPE_PRICE_PROFESSIONAL:}
    price-featured: ${STRIPE_PRICE_FEATURED:}
    connect-return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/agency/billing?connect=return}
    connect-refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:3000/agency/billing?connect=refresh}
  service-region:
    # Comma-expand later (e.g. MA,RI). ZIP prefixes keep postal checks strict per state.
    # Quote ZIP3 values — unquoted 010 is parsed as a number and loses the leading zero.
    allowed-states: ${APP_ALLOWED_STATES:MA}
    zip-prefixes:
      MA: ["010","011","012","013","014","015","016","017","018","019","020","021","022","023","024","025","026","027"]

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.okaynow: INFO
